<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Challenge Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Dev Challenge Generator</h1>
    </header>

    <div id="projectModal" class="hidden">
      <div id="projectDetails">
        <h2 id="name"></h2>
        <p id="challangeDescription"></p>

        <div>
          <span><strong>Category:</strong></span>
          <span id="category"></span>
        </div>

        <div>
          <span><strong>Difficulty:</strong></span>
          <span id="difficulty"></span>
        </div>

        <div>
          <span><strong>Tags:</strong></span>
          <span id="tags"></span>
        </div>

        <button id="leave">Back</button>
        <button id="choose">Choose challange</button>
      </div>
    </div>

    <main>
      <p>Dont know what to do? Get inspo for your next project here!</p>
      <button id="generateButton">Generate Challenge</button>
      <div id="challengeContainer">
        <p id="challengeHeader">Your todays challenge options:</p>
        <ul id="challengeList">
          <li>
            <span class="textPart">option 1 </span>
            <button class="optionButton">Choose</button>
          </li>
          <li>
            <span class="textPart">option 2</span>
            <button class="optionButton">Choose</button>
          </li>
          <li>
            <span class="textPart">option 3 </span>
            <button class="optionButton">Choose</button>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
