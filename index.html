<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Challenge Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Dev Challenge Generator</h1>
    </header>

    <main>
      <p>Dont know what to do? Get inspo for your next project here!</p>
      <button id="generateButton">Generate Challenge</button>
      <div id="challengeContainer">
        <p id="challengeHeader">Your todays challenge options:</p>
        <ul id="challengeList">
          <li>
            <span class="textPart">option 1 </span> <button class = "optionButton">Choose</button>
          </li>
          <li>
            <span class="textPart">option 2</span> <button class = "optionButton">Choose</button>
          </li>
          <li>
            <span class="textPart">option 3 </span> <button class = "optionButton">Choose</button>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
